# =============================================================================
# Redis TTL Configuration
# -----------------------------------------------------------------------------
# Purpose:
#   Defines time-to-live (TTL) values for Redis keys used by the fraud engine.
#   These TTLs control how long behavioral memory is retained for feature
#   computation. TTLs are FEATURE-driven, not cleanup-driven.
#
# Design Principles:
#   - Short TTLs → burst / velocity detection
#   - Long TTLs  → behavioral memory & baselines
#   - No scoring logic here (only state retention)
# =============================================================================

# ---------------------------------------------------------------------------
# Authentication-related Redis memory
# ---------------------------------------------------------------------------
auth:
  fail_window: 600          # AUTH-01, AUTH-03
                            # Failed login attempts window (10 minutes)

  ip_fail_window: 900       # AUTH-02
                            # IP-based brute force detection window (15 minutes)

  success_window: 300       # AUTH-10 — rapid success velocity (5 minutes)


# ---------------------------------------------------------------------------
# Identity & device behavior memory
# ---------------------------------------------------------------------------
identity:
  device_memory: 2592000    # AUTH-04
                            # Device history retention per user (30 days)

  geo_memory: 2592000       # AUTH-05
                            # Geo-location history retention (30 days)
                            
  browser_memory: 86400         # 1 day
                                 # Browser baseline memory

  screen_resolution_memory: 86400  # 1 day
                                   # Environment consistency check

  language_memory: 2592000      # 30 days
                                 # Long-term behavior drift


# ---------------------------------------------------------------------------
# Behavioral baselines (future expansion)
# ---------------------------------------------------------------------------
behavior:
  time_of_day: 1209600      # AUTH-09 (future / extended)
                            # Login hour behavior baseline (14 days)


# ---------------------------------------------------------------------------
# Biometric / liveness checks
# ---------------------------------------------------------------------------
liveness:
  attempt_window: 600       # LIVE-01
                            # Liveness spoof detection window (10 minutes)


# ---------------------------------------------------------------------------
# Enrollment process behavior
# ---------------------------------------------------------------------------
enroll:
  doc_fail_window: 900      # ENR-01
                            # Document verification failure window (15 minutes)

  bio_mismatch_window: 900  # ENR-02
                            # Face vs document mismatch window (15 minutes)

  device_identity_window: 1200  # ENR-03
                               # Multiple identities from same device window (20 minutes)


# ---------------------------------------------------------------------------
# Consent activity tracking
# ---------------------------------------------------------------------------
consent:
  grant_window: 300        # CONS-01
                            # Consent grant spike detection window (5 minutes)


# ---------------------------------------------------------------------------
# Wallet activity tracking
# ---------------------------------------------------------------------------
wallet:
  provision_window: 300           # WAL-01 (wallet provisioning velocity)(5 minutes)
  share_window: 300               # WAL-02 (wallet sharing velocity)(5 minutes)
