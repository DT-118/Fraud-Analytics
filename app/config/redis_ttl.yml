# Redis behavioral-state retention.
#
# These values define how long the fraud engine keeps short-term behavioral
# state used by feature calculations. They are feature-retention settings,
# not general Redis cleanup settings.
#
# Values are stored in seconds. The equivalent duration is shown beside every
# value for quick operational understanding.
#
# Keep each TTL at least as long as the detection window that the feature
# needs to observe. Changing a TTL can change fraud-detection behavior and
# therefore requires regression testing.
#

auth:

  # Failed-authentication history used by AUTH_CONSECUTIVE_FAILURES.
  fail_window: 600  # 600 seconds = 10 minutes

  # Failed-authentication history grouped by source IP for AUTH_IP_BRUTE_FORCE.
  ip_fail_window: 900  # 900 seconds = 15 minutes

  # Recent successful-authentication history used by AUTH_SUCCESS_VELOCITY.
  success_window: 300  # 300 seconds = 5 minutes


identity:

  # How long we remember a subject's last location (detects IF it changed) — the window counting HOW MANY changes is in thresholds.yml GEO_VELOCITY.velocity_window_seconds.
  geo_memory: 86400  # 86400 seconds = 24 hours 

  # Browser history used to detect AUTH_BROWSER_DOWNGRADE.
  browser_memory: 86400  # 86400 seconds = 24 hours

  # Screen-resolution history used by AUTH_SUSPICIOUS_SCREEN_RESOLUTION.
  screen_resolution_memory: 86400  # 86400 seconds = 24 hours

  # Last-seen language per subject (used to detect a change). This does NOT
  # control how flips are counted; that window is
  # thresholds.yml -> AUTH_LANGUAGE_FLIP.flip_window_seconds.
  language_memory: 2592000  # 2592000 seconds = 30 days


biometric:

  # Recent liveness attempts used by BIOMETRIC_SPOOF_DETECTED (all services).
  spoof_window: 600  # 600 seconds = 10 minutes

  # Face-to-UDB mismatch history used by UDB_FACE_MISMATCH (all services).
  face_mismatch_window: 900  # 900 seconds = 15 minutes


login:

  # Document/UDB mismatch history used by LOGIN_DOCUMENT_UDB_MISMATCH.
  doc_fail_window: 900  # 900 seconds = 15 minutes


consent:

  # Recent consent grants used by CONSENT_GRANT_VELOCITY.
  grant_window: 300  # 300 seconds = 5 minutes


wallet:

  # Recent wallet provisions used by WALLET_PROVISION_VELOCITY.
  provision_window: 300  # 300 seconds = 5 minutes

  # Recent wallet shares used by WALLET_SHARE_VELOCITY.
  share_window: 300  # 300 seconds = 5 minutes


device:
  # Sliding window for DEVICE_SHARED_ACCOUNTS; also the key's overall TTL.
  device_subject_memory: 2592000  # 30 days

  # Sliding window for DEVICE_SHARED_ACCOUNTS_BURST. Must be <= device_subject_memory.
  device_subject_burst_window: 3600  # 1 hour