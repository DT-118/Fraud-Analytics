# Session-level fraud configuration.
#
# Session state is stored in Redis and is used to amplify the score of later
# events within the same session when the session has accumulated suspicious,
# HIGH, or CRITICAL activity.
#
# All session TTL values are stored in seconds. The equivalent duration is
# shown beside every value for quick operational understanding.
#
# Changing these values changes session fraud behavior and should be
# regression-tested.

session_ttl_seconds:

  # Authentication sessions are intentionally short-lived.
  AUTH: 1800  # 1800 seconds = 30 minutes

  # Login workflows may remain active while documents are processed.
  LOGIN: 3600  # 3600 seconds = 1 hour

  # Wallet workflows can span provisioning and sharing operations.
  WALLET: 7200  # 7200 seconds = 2 hours

  # Consent workflows normally complete within an hour.
  CONSENT: 3600  # 3600 seconds = 1 hour

  # Fallback for an unknown service.
  default: 3600  # 3600 seconds = 1 hour


# Maximum number of recent event scores retained in the session JSON.
# This prevents unbounded Redis value growth.
max_scores_stored: 20

# Score at or above this value counts as suspicious for session amplification.
# This is the authoritative session threshold used by session_service.py.
suspicious_score_threshold: 30