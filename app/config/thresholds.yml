# Feature-behavior thresholds.
#
# This file controls feature extraction behavior, not rule weights.
# It defines when feature counters activate and what supporting values the
# feature layer uses.
#
# Rule IDs are meaningful, stable identifiers. They must match the IDs in
# config/rules/*.yaml and must never be reused for a different rule.
#
# Keep feature thresholds separate from scoring thresholds so changing a
# feature's detection window does not silently change its score weight.

# Authentication: number of failures required before a successful authentication is
# considered a success-after-failure event.
AUTH_SUCCESS_AFTER_FAILURES:
  min_failures_before_success: 3

# Authentication: browser downgrade detection.
# `min_failures` prevents a browser downgrade from being scored without a
# preceding failure pattern.
# `min_browser_drop` is per browser family so validated browser-specific
# thresholds can be introduced without changing feature code.
AUTH_BROWSER_DOWNGRADE:
  min_failures: 2
  min_browser_drop:
    default: 10
    CHROME: 10
    EDGE: 10
    FIREFOX: 10
    SAFARI: 10

# Authentication: language-change counting for AUTH_LANGUAGE_FLIP.
# Only changes inside this sliding window are counted. The last-seen language
# itself is remembered longer (redis_ttl.yml -> identity.language_memory).
AUTH_LANGUAGE_FLIP:
  flip_window_seconds: 86400  # 86400 seconds = 24 hours

# Configured off-hours window (generic — AUTH/LOGIN/CONSENT/WALLET).
# The feature evaluates event_time in Asia/Kolkata.
ODD_HOUR_ACTIVITY:
  odd_hour_start: 0  # 00:00 IST
  odd_hour_end: 4    # 04:00 IST

# Device: number of distinct devices allowed before a new-device event
# becomes a fraud signal. The allowance is shared across services.
DEVICE_NEW_DEVICE_ALLOWANCE:
  free_device_allowance: 3

# Device: time window used when measuring rapid new-device switching.
DEVICE_SWITCH_VELOCITY:
  velocity_window_seconds: 60  # 60 seconds = 1 minute

# Geo: time window used when measuring repeated location changes.
GEO_VELOCITY:
  velocity_window_seconds: 300  # 300 seconds = 5 minutes