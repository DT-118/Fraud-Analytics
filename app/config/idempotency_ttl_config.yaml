# Per-service idempotency retention.
#
# The fraud engine stores event IDs in Redis with these TTLs to prevent
# duplicate processing during Kafka redelivery and upstream retries.
#
# TTLs should cover the expected duplicate/retry window for each service.
# The durable fraud_decisions.event_id unique constraint remains the final
# database-level duplicate safeguard when Redis is unavailable.
#
# Rule:
#   Never reduce a TTL below the maximum retry/redelivery window without
#   reviewing duplicate-processing behavior for that service.

ttl_seconds:

  # Authentication retries are normally short-lived; retain duplicates for 24h.
  AUTH: 86400

  # Login retries are expected within the same day; retain for 24h.
  LOGIN: 86400

  # Wallet reconciliation can retry days later; retain for 7 days.
  WALLET: 604800

  # Consent batch/overnight retries may arrive later; retain for 48h.
  CONSENT: 172800

  # Safe fallback for an unknown or missing service mapping.
  default: 86400