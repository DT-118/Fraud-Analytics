# Cross-service fraud patterns.
#
# A pattern links a recent suspicious event in one service to activity in
# another service. Pattern evaluation is bidirectional in the profile layer:
# the relationship can be detected when either service is processed.
#
# trigger_service:
#   Service whose recent risk level activates the pattern.
#
# trigger_risk_levels:
#   Risk levels from the trigger service that qualify.
#
# target_service:
#   Service being evaluated in the current relationship.
#
# window_minutes:
#   Maximum age of the trigger event for the relationship to qualify.
#
# reason:
#   Stable identifier stored with the cross-service flag for investigation.
#
# Pattern identifiers/reasons are stable audit values and should not be reused
# for a different fraud relationship.

patterns:

  # Detects suspicious authentication activity followed by wallet activity.
  - trigger_service: AUTH
    trigger_risk_levels:
      - HIGH
      - CRITICAL
    target_service: WALLET
    window_minutes: 30
    reason: HIGH_AUTH_BEFORE_WALLET_30MIN

  # Detects suspicious login activity followed by authentication.
  - trigger_service: LOGIN
    trigger_risk_levels:
      - HIGH
      - CRITICAL
    target_service: AUTH
    window_minutes: 60
    reason: HIGH_LOGIN_BEFORE_AUTH_60MIN

  # Detects critical authentication activity followed by consent activity.
  - trigger_service: AUTH
    trigger_risk_levels:
      - CRITICAL
    target_service: CONSENT
    window_minutes: 60
    reason: CRITICAL_AUTH_BEFORE_CONSENT_60MIN

  # Detects suspicious wallet activity followed by a later login.
  - trigger_service: WALLET
    trigger_risk_levels:
      - HIGH
      - CRITICAL
    target_service: LOGIN
    window_minutes: 120
    reason: HIGH_WALLET_BEFORE_LOGIN_120MIN

  # Detects suspicious consent activity followed quickly by wallet activity.
  - trigger_service: CONSENT
    trigger_risk_levels:
      - HIGH
      - CRITICAL
    target_service: WALLET
    window_minutes: 15
    reason: HIGH_CONSENT_BEFORE_WALLET_15MIN