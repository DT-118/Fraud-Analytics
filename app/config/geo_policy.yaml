# Per-service geographic policy.
#
# allowed_prefixes:
#   Geographic prefixes treated as inside the service's allowed zone.
#   The geo feature layer uses prefix matching against geo_loc.


default:
  allowed_prefixes:
    - AE

AUTH:
  allowed_prefixes:
    - AE

LOGIN:
  allowed_prefixes:
    - AE

WALLET:
  allowed_prefixes:
    - AE

CONSENT:
  allowed_prefixes:
    - AE