fraud_type: CONSENT

rules:

  # ---------------------------------------------------------
  # CONS-01: Consent Grant Spike
  # Detects unusually high number of consent grants
  # by the same user within a short time window.
  # ---------------------------------------------------------
  CONS-01:
    enabled: true
    feature: consent_grant_count
    thresholds:
      - min: 3
        max: 3
        weight: 15     # suspicious
      - min: 4
        max: 4
        weight: 30     # elevated
      - min: 5
        max: 5
        weight: 45     # high
      - min: 6
        max: 7
        weight: 60     # critical
      - min: 8
        weight: 80     # extreme spike

  # Device used by multiple distinct subjects — shared/fraud device
  DEVICE-01:
    enabled: true
    feature: device_subject_count
    thresholds:
      - min: 5
        max: 14
        weight: 40
      - min: 15
        weight: 70

  # Source IP is on the flagged blocklist
  IP-01:
    enabled: true
    feature: ip_is_flagged
    thresholds:
      - min: 1
        weight: 50

  # User's current geo_loc is outside UAE territory — policy block
  GEO-01:
    enabled: true
    feature: is_outside_uae
    thresholds:
      - min: 1
        weight: 80

  # Behavioral deviation from personal baseline (Phase 5)
  BASELINE-01:
    enabled: true
    feature: deviation_score
    thresholds:
      - min: 50
        max: 74
        weight: 20
      - min: 75
        max: 89
        weight: 40
      - min: 90
        weight: 60


# ---------------------------------------------------------------------------
# Rule chains — Phase 4 Decision Intelligence
# ---------------------------------------------------------------------------
chains:

  # Shared device + consent spike = consent farming / delegated access fraud
  - trigger_rules: ["DEVICE-01"]
    target_rule: "CONS-01"
    weight_multiplier: 1.5
    reason: "SHARED_DEVICE_CONSENT_SPIKE"

  # Flagged IP + consent spike = malicious bulk consent grant from known-bad actor
  - trigger_rules: ["IP-01"]
    target_rule: "CONS-01"
    weight_multiplier: 1.6
    reason: "FLAGGED_IP_CONSENT_SPIKE"

  # Behavioral deviation + consent spike = anomalous grant rate for this user
  - trigger_rules: ["BASELINE-01"]
    target_rule: "CONS-01"
    weight_multiplier: 1.3
    reason: "BASELINE_DEVIATION_CONSENT_SPIKE"
