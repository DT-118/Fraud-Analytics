fraud_type: AUTH

rules:

  # Multiple consecutive login failures for the same user within a short window
  AUTH-01:
    enabled: true
    feature: user_fail_count
    thresholds:
      - min: 2
        max: 2
        weight: 30
      - min: 3
        max: 3
        weight: 60
      - min: 4
        weight: 80


  # Same source IP failing login attempts across many different users
  AUTH-02:
    enabled: true
    feature: ip_failed_subject_count
    thresholds:
      - min: 3
        max: 3
        weight: 45
      - min: 4
        weight: 60

  # Successful login following a sustained failure streak (credential stuffing signal)
  AUTH-03:
    enabled: true
    feature: fail_before_success
    thresholds:
      - min: 3
        weight: 20

  # Login from a device not previously seen for this user
  AUTH-04:
    enabled: true
    feature: is_new_device
    thresholds:
      - min: 1
        max: 1
        weight: 60     # second device
      - min: 2
        weight: 80     # third device

  # Sudden geographic location change compared to last known login
  AUTH-05:
    enabled: true
    feature: geo_mismatch
    thresholds:
      - min: 1
        max: 1
        weight: 30

  # Browser downgrade detected under recent authentication failure pressure
  AUTH-06:
    enabled: true
    feature: is_old_browser
    thresholds:
      - min: 1
        weight: 15

  # Login using emulator-like or automation-associated screen resolutions
  AUTH-07:
    enabled: true
    feature: suspicious_resolution
    thresholds:
      - min: 1
        weight: 15

        
  # Language changes across successful logins
  AUTH-08:
    enabled: true
    feature: language_flip_on_success
    thresholds:
      - min: 2
        max: 2
        weight: 10
      - min: 3
        weight: 20


  # Login occurring outside normal daytime hours
  AUTH-09:
    enabled: true
    feature: odd_login_hour
    thresholds:
      - min: 1
        weight: 15

    # Rapid successful logins — credential sharing or automated access
  AUTH-10:
    enabled: true
    feature: success_velocity
    thresholds:
      - min: 3
        max: 4
        weight: 20     # 3-4 successes in 5 min — suspicious
      - min: 5
        max: 7
        weight: 40     # 5-7 successes — elevated
      - min: 8
        weight: 60     # 8+ successes — strong signal

  # Repeated biometric liveness spoof detections during authentication
  LIVE-01:
    enabled: true
    feature: spoof_detected
    thresholds:
      - min: 1
        max: 1
        weight: 60
      - min: 2
        weight: 100

  # Required liveness check missing during authentication
  LIVE-02:
    enabled: true
    feature: missing_liveness
    thresholds:
      - min: 1
        weight: 60

  # Device used by multiple distinct subjects — shared/fraud device
  DEVICE-01:
    enabled: true
    feature: device_subject_count
    thresholds:
      - min: 5
        max: 14
        weight: 40     # suspicious — device used by 5–14 subjects
      - min: 15
        weight: 70     # confirmed fraud device — 15+ subjects

  # Source IP is on the flagged blocklist (Tor exit, datacenter, known bad)
  IP-01:
    enabled: true
    feature: ip_is_flagged
    thresholds:
      - min: 1
        weight: 50

  # User's current geo_loc is outside UAE territory — policy block
  # Weight 80 alone reaches CRITICAL. No role modifier applied.
  # Distinct from AUTH-05 (geo_mismatch), which detects a change in location;
  # GEO-01 detects absolute position — the user is not in UAE at all.
  GEO-01:
    enabled: true
    feature: is_outside_uae
    thresholds:
      - min: 1
        weight: 80

  # Behavioral deviation from personal baseline (Phase 5)
  # Fires when the user's current behavior is statistically anomalous relative
  # to their own history (z-score). Requires MIN_SAMPLES=10 prior events.
  BASELINE-01:
    enabled: true
    feature: deviation_score
    thresholds:
      - min: 50
        max: 74
        weight: 20    # moderate deviation (max z ≈ 2.0–3.0)
      - min: 75
        max: 89
        weight: 40    # significant deviation (max z ≈ 3.0–3.6)
      - min: 90
        weight: 60    # extreme deviation (max z ≥ 3.6)


# ---------------------------------------------------------------------------
# Rule chains — Phase 4 Decision Intelligence
#
# A chain fires when ALL trigger_rules have fired in the same event.
# The target rule's weight is multiplied by weight_multiplier.
# This models compounding signals that are stronger together than apart.
# ---------------------------------------------------------------------------
chains:

  # New device + login failures = credential stuffing with device rotation
  - trigger_rules: ["AUTH-04"]
    target_rule: "AUTH-01"
    weight_multiplier: 1.5
    reason: "NEW_DEVICE_WITH_FAILURES"

  # Geo jump + new device = strong account takeover signal
  - trigger_rules: ["AUTH-05", "AUTH-04"]
    target_rule: "AUTH-02"
    weight_multiplier: 1.4
    reason: "GEO_JUMP_NEW_DEVICE_WITH_IP_FAILURES"

  # Flagged IP + login failures = known-bad actor credential stuffing
  - trigger_rules: ["IP-01"]
    target_rule: "AUTH-01"
    weight_multiplier: 1.6
    reason: "FLAGGED_IP_WITH_FAILURES"

  # Flagged IP + new device = high-confidence account takeover attempt
  - trigger_rules: ["IP-01", "AUTH-04"]
    target_rule: "AUTH-05"
    weight_multiplier: 1.5
    reason: "FLAGGED_IP_NEW_DEVICE_GEO_JUMP"

  # Liveness spoof + new device = impersonation attempt
  - trigger_rules: ["LIVE-01", "AUTH-04"]
    target_rule: "AUTH-01"
    weight_multiplier: 1.4
    reason: "LIVENESS_SPOOF_NEW_DEVICE"

  # Behavioral deviation + login failures = anomalous failure spike for this user
  - trigger_rules: ["BASELINE-01"]
    target_rule: "AUTH-01"
    weight_multiplier: 1.3
    reason: "BASELINE_DEVIATION_WITH_FAILURES"

  # Behavioral deviation + new device = atypical device at atypical volume
  - trigger_rules: ["BASELINE-01"]
    target_rule: "AUTH-04"
    weight_multiplier: 1.3
    reason: "BASELINE_DEVIATION_NEW_DEVICE"
