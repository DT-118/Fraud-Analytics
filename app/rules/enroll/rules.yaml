fraud_type: ENROLL

rules:

  # ENR-01: Repeated document scan failures
  ENR-01:
    enabled: true
    feature: document_failures
    thresholds:
      - min: 1
        max: 1
        weight: 15
      - min: 2
        max: 2
        weight: 30
      - min: 3
        weight: 60

  # ENR-02: Repeated face-document mismatches
  ENR-02:
    enabled: true
    feature: face_doc_mismatch
    thresholds:
      - min: 1
        max: 1
        weight: 15
      - min: 2
        max: 2
        weight: 40
      - min: 3
        weight: 60

  # ENR-03: Multiple identities from same device
  ENR-03:
    enabled: true
    feature: device_enroll_count
    thresholds:
      - min: 3
        max: 3
        weight: 35
      - min: 4
        max: 4
        weight: 50
      - min: 5
        weight: 70
