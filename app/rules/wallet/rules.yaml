fraud_type: WALLET

rules:

  # ---------------------------------------------------------
  # WAL-01: Provision Velocity
  # Detects how many documents a user provisions within
  # a short time window.
  # ---------------------------------------------------------
  WAL-01:
    enabled: true
    feature: provision_count
    thresholds:
      - min: 3
        max: 3
        weight: 25     # suspicious ? MEDIUM
      - min: 4
        max: 4
        weight: 40     # elevated ? MEDIUM
      - min: 5
        max: 5
        weight: 60     # high ? HIGH
      - min: 6
        max: 7
        weight: 70     # very high ? HIGH
      - min: 8
        weight: 80     # extreme spike ? CRITICAL

  # ---------------------------------------------------------
  # WAL-02: Share Velocity
  # Detects rapid sharing of documents.
  # ---------------------------------------------------------
  WAL-02:
    enabled: true
    feature: share_count
    thresholds:
      - min: 3
        max: 3
        weight: 25     # suspicious ? MEDIUM
      - min: 4
        max: 4
        weight: 40     # elevated ? MEDIUM
      - min: 5
        max: 5
        weight: 60     # high ? HIGH
      - min: 6
        max: 7
        weight: 70     # very high ? HIGH
      - min: 8 
        weight: 80     # extreme spike ? CRITICAL

  # ---------------------------------------------------------
  # WAL-03: Combined Burst
  # combined_burst = min(provision_count, share_count)
  # Detects coordinated rapid provision + sharing behavior.
  # ---------------------------------------------------------
  WAL-03:
    enabled: true
    feature: combined_burst
    thresholds:
      - min: 1
        max: 1
        weight: 15     # weak signal
      - min: 2
        max: 2
        weight: 30     # medium risk
      - min: 3
        max: 3
        weight: 45     # strong signal
      - min: 4
        max: 4
        weight: 65     # high risk
      - min: 5
        weight: 80     # critical coordinated burst

  # Device used by multiple distinct subjects — shared/fraud device
  DEVICE-01:
    enabled: true
    feature: device_subject_count
    thresholds:
      - min: 5
        max: 14
        weight: 40
      - min: 15
        weight: 70

  # Source IP is on the flagged blocklist
  IP-01:
    enabled: true
    feature: ip_is_flagged
    thresholds:
      - min: 1
        weight: 50

  # User's current geo_loc is outside UAE territory — policy block
  GEO-01:
    enabled: true
    feature: is_outside_uae
    thresholds:
      - min: 1
        weight: 80

  # Behavioral deviation from personal baseline (Phase 5)
  BASELINE-01:
    enabled: true
    feature: deviation_score
    thresholds:
      - min: 50
        max: 74
        weight: 20
      - min: 75
        max: 89
        weight: 40
      - min: 90
        weight: 60


# ---------------------------------------------------------------------------
# Rule chains — Phase 4 Decision Intelligence
# ---------------------------------------------------------------------------
chains:

  # High provision burst from a shared device = organized fraud
  - trigger_rules: ["DEVICE-01"]
    target_rule: "WAL-01"
    weight_multiplier: 1.5
    reason: "SHARED_DEVICE_PROVISION_BURST"

  # Flagged IP + share burst = coordinated credential-sharing fraud
  - trigger_rules: ["IP-01"]
    target_rule: "WAL-02"
    weight_multiplier: 1.6
    reason: "FLAGGED_IP_SHARE_BURST"

  # Combined burst from flagged IP = critical coordinated attack
  - trigger_rules: ["IP-01", "DEVICE-01"]
    target_rule: "WAL-03"
    weight_multiplier: 1.5
    reason: "FLAGGED_IP_SHARED_DEVICE_COMBINED_BURST"

  # Behavioral deviation + provision burst = anomalous provisioning rate for this user
  - trigger_rules: ["BASELINE-01"]
    target_rule: "WAL-01"
    weight_multiplier: 1.3
    reason: "BASELINE_DEVIATION_PROVISION_BURST"
